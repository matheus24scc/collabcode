version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: collabcode_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collabcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabcode_pass}
      POSTGRES_DB: ${POSTGRES_DB:-collabcode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: collabcode_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
